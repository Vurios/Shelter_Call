name: NASA data pipeline
on:
  workflow_dispatch:
    inputs:
      start:
        description: First UTC date
        default: '2010-01-01'
        required: true
      end:
        description: Last UTC date
        default: '2026-10-08'
        required: true
permissions:
  contents: read
concurrency:
  group: nasa-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        with:
          path: data-pipeline/raw
          key: donki-v1-${{ inputs.start }}-${{ inputs.end }}-${{ github.run_id }}
          restore-keys: donki-v1-${{ inputs.start }}-
      - run: pip install 'requests>=2.32,<3'
      - name: Fetch official DONKI records
        env:
          FIRST_DATE: ${{ inputs.start }}
          LAST_DATE: ${{ inputs.end }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: python -u data-pipeline/fetch_donki.py --start "$FIRST_DATE" --end "$LAST_DATE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nasa-raw-cache
          path: data-pipeline/raw/
          retention-days: 30
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data-pipeline/raw
          key: donki-v1-${{ inputs.start }}-${{ inputs.end }}-${{ github.run_id }}
